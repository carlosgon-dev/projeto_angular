name: Deploy Angular to GitHub Pages

on:
  push:
    branches: [ "main" ]
permissions:
  contents: read
  pages: write
  id-token: write
concurrency:
  group: "pages"
  cancel-in-progress: false
jobs:
  build-and-deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 'latest'
          cache: 'npm'

      - name: Install dependencies
        run: npm ci

      - name: Pôr as chaves do Supabase (vindas do cofre)
        run: |
          sed -i "s|__SUPABASE_URL__|${{ secrets.SUPABASE_URL }}|" src/environments/environment.ts
          sed -i "s|__SUPABASE_KEY__|${{ secrets.SUPABASE_KEY }}|" src/environments/environment.ts

      - name: Build Angular Project
        run: |
          npm run build -- --configuration production --base-href "/projeto_angular/"
          cp dist/meu-projeto/browser/index.html dist/meu-projeto/browser/404.html

      - name: Setup Pages
        uses: actions/configure-pages@v4

      - name: Upload artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: 'dist/meu-projeto/browser'
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4

name: Deploy Angular to GitHub Pages

on:
  push:
    branches: [ "main" ]
permissions:
  contents: read
  pages: write
  id-token: write
concurrency:
  group: "pages"
  cancel-in-progress: false
jobs:
  build-and-deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '24'
          cache: 'npm'

      - name: Install dependencies
        run: npm ci

      # Troca os marcadores __...__ do environment.ts pelas chaves do cofre do GitHub.
      # O .trim() limpa espaços e "Enters" a mais que possam ter ido no copiar/colar.
      - name: Pôr as chaves do Supabase (vindas do cofre)
        env:
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_KEY: ${{ secrets.SUPABASE_KEY }}
        run: |
          node -e "
            const fs = require('fs');
            const ficheiro = 'src/environments/environment.ts';
            const texto = fs.readFileSync(ficheiro, 'utf8')
              .replace('__SUPABASE_URL__', process.env.SUPABASE_URL.trim())
              .replace('__SUPABASE_KEY__', process.env.SUPABASE_KEY.trim());
            fs.writeFileSync(ficheiro, texto);
          "

      - name: Build Angular Project
        run: |
          npm run build -- --configuration production --base-href "/projeto_angular/"
          cp dist/meu-projeto/browser/index.html dist/meu-projeto/browser/404.html

      - name: Setup Pages
        uses: actions/configure-pages@v4

      - name: Upload artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: 'dist/meu-projeto/browser'
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4

<header class="topo">
  <a class="marca" routerLink="/" (click)="fechar_menu()">Arena <b>do</b> Riso</a>

  <button class="burger" (click)="alternar_menu()" aria-label="Abrir o menu">
    {{ menu_aberto() ? '✕' : '☰' }}
  </button>

  <nav [class.aberto]="menu_aberto()" (click)="fechar_menu()">
    <a routerLink="/" routerLinkActive="ativo" [routerLinkActiveOptions]="{ exact: true }">Início</a>
    <a routerLink="/arena" routerLinkActive="ativo">Arena</a>
    <a routerLink="/explorar" routerLinkActive="ativo">Explorar</a>
    <a routerLink="/gerador" routerLinkActive="ativo">Gerador</a>
    <a routerLink="/escrever" routerLinkActive="ativo">Escrever</a>
    <a routerLink="/criado" routerLinkActive="ativo">Criado por ti</a>
      @if (auth_service.utilizador(); as utilizador) {
      <button class="sair" (click)="sair()" [title]="utilizador.email">🚪 Sair</button>
    } @else {
      <a routerLink="/entrar" routerLinkActive="ativo">🔐 Entrar</a>
    }

  
  </nav>
</header>
